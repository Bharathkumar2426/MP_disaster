services:
  # -- Backend (FastAPI) --
  - type: web
    name: disaster-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 2 -k uvicorn.workers.UvicornWorker main:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: DATABASE_URL
        sync: false        # Set manually: paste your Neon connection string here
      - key: FRONTEND_URL
        sync: false        # Set manually: your Render frontend URL
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENCAGE_API_KEY
        sync: false
      - key: NOAA_CDO_TOKEN
        sync: false
      - key: OPEN_METEO_BASE_URL
        value: https://api.open-meteo.com/v1/forecast
      - key: AI_CONFIDENCE_THRESHOLD
        value: "0.60"
      - key: AI_RISK_THRESHOLD
        value: "0.70"
      - key: MAX_UPLOAD_SIZE_MB
        value: "20"

  # -- Frontend (React/Vite Static Site) --
  - type: web
    name: disaster-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 20.0.0
      - key: VITE_API_BASE_URL
        sync: false        # Set manually: your Render backend URL + /api
